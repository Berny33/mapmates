<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MapMates</title>
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <div class="ambient ambient-grid" aria-hidden="true"></div>
    <div class="ambient ambient-glow" aria-hidden="true"></div>

    <header class="site-header">
      <a class="brand" href="/" aria-label="MapMates home">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>MapMates</span>
      </a>
      <nav class="header-nav" aria-label="Main navigation">
        <a class="nav-link" href="/login.html">Log in</a>
        <a class="avatar-link" href="/login.html" aria-label="Sign in">
          <span class="icon icon-person" aria-hidden="true"></span>
        </a>
      </nav>
    </header>

    <main class="home-main">
      <div class="route-art" aria-hidden="true">
        <svg viewBox="0 0 1440 760" preserveAspectRatio="none">
          <path d="M80 490C310 400 430 280 670 330S1030 500 1360 290" />
          <path d="M110 245C360 170 520 470 810 400S1130 230 1380 385" />
          <path d="M260 660C490 570 650 500 890 535S1170 660 1370 565" />
        </svg>
      </div>

      <section class="home-hero" aria-labelledby="home-title">
        <p class="eyebrow">Make every journey yours</p>
        <h1 id="home-title">Plan trips together.<br />Or alone.</h1>
        <p class="hero-copy">
          Collaborative itineraries, shared pins, and effortless journeys in real time.
        </p>
        <a class="button button-primary hero-cta" href="/register.html">
          Start a trip
          <span class="icon icon-arrow" aria-hidden="true"></span>
        </a>
        <p id="homeMessage" class="message" aria-live="polite"></p>
      </section>
    </main>

    <footer class="site-footer">
      <span>© 2025 MapMates. Infinite journeys together.</span>
      <nav aria-label="Footer navigation">
        <a href="/login.html">Log in</a>
        <a href="/register.html">Create account</a>
      </nav>
    </footer>

    <script type="module" src="./js/app.js"></script>
  </body>
</html>
